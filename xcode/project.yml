# xcodegen spec for the glfwmw WebGPU triangle example (iOS).
#
# The app target compiles only the example source; all dependencies are the
# single merged static library produced by the Makefile:
#   - libglfwmw.a  (GLFW + GLFM backend + WebGPU surface bridge + wgpu-native;
#                   the GLFWM_WGPU flavor)
#
# Generate with: xcodegen generate --spec xcode/project.yml --project build/xcode
# Device builds need a signing team: set DEVELOPMENT_TEAM below or via
#   xcodebuild ... DEVELOPMENT_TEAM=<team-id>
name: GlfwmTriangle
options:
  bundleIdPrefix: net.takeiteasy.glfwm
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: net.takeiteasy.glfwm.triangle
    INFOPLIST_FILE: ../../xcode/App-Info.plist
    ARCHS: arm64
    GCC_PREPROCESSOR_DEFINITIONS:
      - GLFW_INCLUDE_NONE=1
      - GLFWM_WGPU=1
    HEADER_SEARCH_PATHS:
      - ../../deps
      - ../../deps/glfw/include
      - ../../platform/glfm
      - ../../deps/webgpu
    OTHER_LDFLAGS:
      - -lglfwmw

targets:
  Triangle-Sim:
    type: application
    platform: iOS
    sources:
      - ../examples/triangle.c
    settings:
      base:
        PRODUCT_NAME: triangle
        LIBRARY_SEARCH_PATHS:
          - ../../build/ios-sim
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: OpenGLES.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework

  Triangle-Device:
    type: application
    platform: iOS
    sources:
      - ../examples/triangle.c
    settings:
      base:
        PRODUCT_NAME: triangle
        LIBRARY_SEARCH_PATHS:
          - ../../build/ios-device
        CODE_SIGN_IDENTITY: Apple Development
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreGraphics.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: OpenGLES.framework
      - sdk: CoreMotion.framework
      - sdk: CoreHaptics.framework

schemes:
  Triangle-Sim:
    build:
      targets:
        Triangle-Sim: all
    run:
      config: Debug
  Triangle-Device:
    build:
      targets:
        Triangle-Device: all
    run:
      config: Debug
